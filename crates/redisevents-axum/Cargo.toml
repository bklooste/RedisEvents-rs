[package]
name = "redisevents-axum"
description = "Admin endpoints and health checks for redisevents, on axum."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = true
readme = "README.md"
documentation = "https://docs.rs/redisevents-axum"
homepage = "https://github.com/bklooste/RedisEvents-rs"
keywords = ["redis", "streams", "axum", "health-check", "admin"]
categories = ["web-programming", "asynchronous"]

[lints]
workspace = true

[dependencies]
axum = "0.8.9"
redis = "1.8.0"
redisevents = { path = "../redisevents", version = "0.4.0" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
time = { version = "0.3.55", features = ["parsing", "formatting"] }
tower = "0.5.3"

[dev-dependencies]
redisevents-test-support = { path = "../redisevents-test-support" }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros"] }
tower = { version = "0.5.3", features = ["util"] }
