[package]
name = "redisevents"
description = "Wire-compatible Rust port of RedisEvents: partitioned Redis Streams topics, per-key ordering, at-least-once delivery."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
bytes = "1.12.1"
opentelemetry = { version = "0.33.1", default-features = false, features = ["metrics", "trace"], optional = true }
redis = { version = "1.8.0", features = ["tokio-comp", "connection-manager", "streams", "script"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10.9"
thiserror = "2.0.21"
time = { version = "0.3.55", features = ["formatting", "parsing", "macros", "serde-well-known"] }
tokio = { version = "1.54.1", features = ["rt", "sync", "time", "macros"] }
tokio-util = "0.7.20"
tracing = "0.1.44"
uuid = { version = "1.29.0", features = ["v4", "serde"] }
xxhash-rust = { version = "0.8.19", features = ["xxh3"] }

[dev-dependencies]
base64 = "0.23.1"
proptest = "1.12.0"
redisevents-test-support = { path = "../redisevents-test-support" }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros"] }
tracing-subscriber = { version = "0.3", features = ["registry"] }

[features]
## OpenTelemetry export: spans and metrics through the `opentelemetry` API (global tracer and meter
## named `RedisEvents`). Without it spans are `tracing` spans and metrics are no-ops.
otel = ["dep:opentelemetry"]
## In-memory test doubles (`redisevents::testing`).
testing = []
