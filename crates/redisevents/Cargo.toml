[package]
name = "redisevents"
description = "Wire-compatible Rust port of RedisEvents: partitioned Redis Streams topics, per-key ordering, at-least-once delivery."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = true
readme = "README.md"
documentation = "https://docs.rs/redisevents"
homepage = "https://github.com/bklooste/RedisEvents-rs"
keywords = ["redis", "streams", "messaging", "event-driven", "partitioning"]
categories = ["asynchronous", "network-programming"]

[lints]
workspace = true

[dependencies]
bytes = "1.12.1"
opentelemetry = { version = "0.33.1", default-features = false, features = ["metrics", "trace"], optional = true }
redis = { version = "1.8.0", features = ["tokio-comp", "connection-manager", "streams", "script"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10.9"
thiserror = "2.0.21"
time = { version = "0.3.55", features = ["formatting", "parsing", "macros", "serde-well-known"] }
tokio = { version = "1.54.1", features = ["rt", "sync", "time", "macros"] }
tokio-util = "0.7.20"
tracing = "0.1.44"
uuid = { version = "1.29.0", features = ["v4", "serde"] }
xxhash-rust = { version = "0.8.19", features = ["xxh3"] }

[dev-dependencies]
criterion = { version = "0.7", default-features = false, features = ["cargo_bench_support"] }
base64 = "0.23.1"
proptest = "1.12.0"
redisevents-test-support = { path = "../redisevents-test-support" }
opentelemetry = { version = "0.33.1", default-features = false, features = ["metrics", "trace"] }
opentelemetry_sdk = { version = "0.33.1", default-features = false, features = ["trace", "testing"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "test-util"] }
tracing-subscriber = { version = "0.3", features = ["registry"] }

[features]
## TLS for `rediss://` URLs (C# `ssl=true`), through rustls with the platform-independent webpki roots.
tls-rustls = ["redis/tokio-rustls-comp", "redis/tls-rustls-webpki-roots"]
## OpenTelemetry export: spans and metrics through the `opentelemetry` API (global tracer and meter
## named `RedisEvents`). Without it spans are `tracing` spans and metrics are no-ops.
otel = ["dep:opentelemetry"]
## In-memory test doubles (`redisevents::testing`).
testing = []

[[bench]]
name = "micro"
harness = false
