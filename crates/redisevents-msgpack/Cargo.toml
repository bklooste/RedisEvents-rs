[package]
name = "redisevents-msgpack"
description = "MessagePack typed publish/consume for redisevents, with MessagePack-CSharp compatible size-gated LZ4."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
bytes = "1.12.1"
lz4_flex = "0.14.0"
redisevents = { path = "../redisevents" }
rmp = "0.8.15"
rmp-serde = "1.3.1"
serde = "1.0.229"

[dev-dependencies]
base64 = "0.23.1"
lz4_flex = "0.14.0"
proptest = "1.12.0"
redis = { version = "1.8.0", features = ["tokio-comp", "connection-manager", "streams"] }
redisevents-test-support = { path = "../redisevents-test-support" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "test-util"] }
