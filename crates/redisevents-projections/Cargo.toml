[package]
name = "redisevents-projections"
description = "Typed event projections and view stores over any redisevents topic."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
bytes = "1.12.1"
opentelemetry = { version = "0.33.1", default-features = false, features = ["metrics"], optional = true }
redis = { version = "1.8.0", features = ["tokio-comp", "connection-manager"] }
redisevents = { path = "../redisevents" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tracing = "0.1.44"

[dev-dependencies]
bytes = "1.12.1"
tracing = "0.1.44"
inventory-domain = { path = "../../samples/inventory/inventory-domain" }
redisevents = { path = "../redisevents", features = ["testing"] }
redisevents-test-support = { path = "../redisevents-test-support" }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time", "sync"] }
tokio-util = "0.7.20"
tracing-subscriber = { version = "0.3", features = ["registry"] }
uuid = { version = "1.29.0", features = ["v4"] }

[features]
## Export the `redisevents.projections.events.malformed` counter on the global OpenTelemetry meter
## `RedisEvents.Projections`. Spans are `tracing` spans either way.
otel = ["dep:opentelemetry"]
