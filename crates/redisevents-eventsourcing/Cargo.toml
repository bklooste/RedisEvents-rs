[package]
name = "redisevents-eventsourcing"
description = "Event-sourced aggregates and an optimistic-concurrency repository on redisevents."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = true
readme = "README.md"
documentation = "https://docs.rs/redisevents-eventsourcing"
homepage = "https://github.com/bklooste/RedisEvents-rs"
keywords = ["redis", "event-sourcing", "aggregates", "cqrs", "streams"]
categories = ["asynchronous", "data-structures"]

[lints]
workspace = true

[dependencies]
bytes = "1.12.1"
opentelemetry = { version = "0.33.1", default-features = false, features = ["metrics"], optional = true }
redisevents = { path = "../redisevents", version = "0.2.0" }
redisevents-projections = { path = "../redisevents-projections", version = "0.2.0" }
thiserror = "2.0.21"
tracing = "0.1.44"

[dev-dependencies]
bytes = "1.12.1"
inventory-domain = { path = "../../samples/inventory/inventory-domain" }
redis = { version = "1.8.0", features = ["tokio-comp", "connection-manager"] }
redisevents = { path = "../redisevents", version = "0.2.0", features = ["testing"] }
redisevents-test-support = { path = "../redisevents-test-support" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time", "sync"] }
tracing-subscriber = { version = "0.3", features = ["registry"] }
uuid = { version = "1.29.0", features = ["v4"] }

[features]
## Export `eventsourcing.saves`, `eventsourcing.save.conflicts` and `eventsourcing.loads` on the global
## OpenTelemetry meter `RedisEvents.EventSourcing`. Spans are `tracing` spans either way.
otel = ["dep:opentelemetry"]
