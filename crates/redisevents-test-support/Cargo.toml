[package]
name = "redisevents-test-support"
description = "Test support for redisevents integration tests: a Redis (REDIS_URL or testcontainers redis:8-alpine) and a recording handler."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
bytes = "1.12.1"
redis = { version = "1.8.0", features = ["tokio-comp", "connection-manager"] }
redisevents = { path = "../redisevents", version = "0.4.0" }
testcontainers = { version = "0.28.0", default-features = false, features = ["reusable-containers"] }
tokio = { version = "1.54.1", features = ["sync", "time", "macros", "rt-multi-thread"] }
uuid = { version = "1.29.0", features = ["v4"] }
