[package]
name = "inventory-views"
description = "Inventory CQRS-ES sample, read side: an axum service over the inventory topic's projected list and detail views."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
axum = "0.8.9"
inventory-domain = { path = "../inventory-domain" }
redisevents = { path = "../../../crates/redisevents" }
redisevents-projections = { path = "../../../crates/redisevents-projections" }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "signal"] }
tracing = "0.1.44"
tracing-subscriber = "0.3"
uuid = "1.29.0"

[dev-dependencies]
redisevents-test-support = { path = "../../../crates/redisevents-test-support" }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time"] }
tower = { version = "0.5.3", features = ["util"] }
