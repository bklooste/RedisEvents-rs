[package]
name = "inventory-command"
description = "Inventory CQRS-ES sample: the write side, an axum service on redisevents-eventsourcing (port of SimpleCQRS.Redis.API)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
axum = "0.8.9"
bytes = "1.12.1"
inventory-domain = { path = "../inventory-domain" }
redisevents = { path = "../../../crates/redisevents" }
redisevents-eventsourcing = { path = "../../../crates/redisevents-eventsourcing" }
redisevents-projections = { path = "../../../crates/redisevents-projections" }
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.54.1", features = ["macros", "net", "rt-multi-thread", "signal", "time"] }
uuid = { version = "1.29.0", features = ["v4", "serde"] }

[dev-dependencies]
redis = { version = "1.8.0", features = ["tokio-comp", "connection-manager"] }
redisevents-test-support = { path = "../../../crates/redisevents-test-support" }
serde_json = "1.0.154"
tower = { version = "0.5.3", features = ["util"] }
