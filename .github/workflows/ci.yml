name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Nightly: catch a C# change on RedisEvents@main that breaks the shared wire contract.
    - cron: "17 3 * * *"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Docs (no broken intra-doc links)
        run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # stable, and the MSRV (stable - 2) from Cargo.toml's rust-version.
        toolchain: [stable, "1.97"]
    services:
      redis:
        image: redis:8-alpine
        ports: ["6379:6379"]
    env:
      REDIS_URL: redis://localhost:6379
      # CI always has Redis: a missing one must fail the run, not skip the Redis tests.
      REDISEVENTS_REQUIRE_REDIS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace
      # The `otel` feature (and `testing`) is off by default; stable only, so MSRV is not gated on it.
      - name: Test with all features
        if: matrix.toolchain == 'stable'
        run: cargo test --workspace --all-features

  semver-checks:
    # Compares the public API with the latest version on crates.io and fails on an unannounced break.
    # Before the first publish there is nothing to compare against, so the check skips (green) instead
    # of failing; it starts gating by itself once `redisevents` exists on crates.io.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Is there a published baseline?
        id: baseline
        run: |
          if curl -fsS -A "RedisEvents-rs CI (github.com/bklooste/RedisEvents-rs)" \
              https://crates.io/api/v1/crates/redisevents >/dev/null; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
            echo "No version of redisevents on crates.io yet: semver check skipped." >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: dtolnay/rust-toolchain@stable
        if: steps.baseline.outputs.published == 'true'
      - uses: Swatinem/rust-cache@v2
        if: steps.baseline.outputs.published == 'true'
      - uses: obi1kenobi/cargo-semver-checks-action@v2
        if: steps.baseline.outputs.published == 'true'
        with:
          exclude: interop-rust-host,inventory-domain,inventory-command,inventory-views,redisevents-test-support

  wire-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: bklooste/RedisEvents
          path: csharp
      - run: python3 scripts/check_wire_drift.py csharp

  interop:
    name: interop (C# from ${{ matrix.csharp }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # nuget = latest published RedisEvents package; main = bklooste/RedisEvents@main built from source.
        csharp: [nuget, main]
    services:
      redis:
        image: redis:8-alpine
        ports: ["6379:6379"]
    env:
      REDIS_URL: redis://localhost:6379
      # CI always has Redis: a missing one must fail the run, not skip the Redis tests.
      REDISEVENTS_REQUIRE_REDIS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        if: matrix.csharp == 'main'
        with:
          repository: bklooste/RedisEvents
          path: csharp
          fetch-depth: 0 # Nerdbank.GitVersioning needs history
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Resolve the latest published RedisEvents version
        if: matrix.csharp == 'nuget'
        run: |
          v=$(curl -fsS https://api.nuget.org/v3-flatcontainer/redisevents/index.json \
            | python3 -c 'import json,sys; print([x for x in json.load(sys.stdin)["versions"] if "-" not in x][-1])')
          echo "RedisEvents NuGet $v"
          echo "DOTNET_ARGS=-p:RedisEventsVersion=$v" >> "$GITHUB_ENV"
      - name: Point the host at RedisEvents@main
        if: matrix.csharp == 'main'
        run: echo "DOTNET_ARGS=-p:UseLocalRedisEvents=$GITHUB_WORKSPACE/csharp -p:TargetFrameworks=net10.0" >> "$GITHUB_ENV"
      - name: Build the C# host
        run: dotnet build interop/dotnet/InteropHost -c Release -o interop/dotnet/out $DOTNET_ARGS
      - name: Build the Rust host
        run: cargo build -p interop-rust-host
      - name: Run the scenarios
        run: >
          python3 interop/scenarios/run.py
          --csharp "dotnet $PWD/interop/dotnet/out/InteropHost.dll"
          --rust "$PWD/target/debug/interop-rust-host"

  sample-matrix:
    name: sample-matrix (inventory interop)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: bklooste/cqrs-simple-micro-service
          path: csharp-sample
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build the Rust views image
        run: docker build -f samples/inventory/inventory-views/Dockerfile -t redisevents-inventory-views:local .
      - name: Build the Rust command image
        run: docker build -f samples/inventory/inventory-command/Dockerfile -t redisevents-inventory-command:local .
      - name: Run the matrix
        run: CSHARP_SAMPLE_DIR=$PWD/csharp-sample samples/inventory/matrix.sh

  publish:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # git height for the version
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Compute version (version.json major.minor + git height)
        id: version
        run: echo "version=$(scripts/set_version.sh)" >> "$GITHUB_OUTPUT"
      - name: Package check
        run: >
          cargo package --allow-dirty -p redisevents -p redisevents-msgpack -p redisevents-projections
          -p redisevents-restate -p redisevents-axum -p redisevents-eventsourcing
      - name: crates.io login (OIDC trusted publishing)
        id: auth
        uses: rust-lang/crates-io-auth-action@v1
        # Trusted publishing only works for a crate that already exists; the first publish uses the
        # CARGO_REGISTRY_TOKEN secret instead (docs/PUBLISHING.md).
        continue-on-error: true
      - name: Publish to crates.io
        run: scripts/publish_crates.sh "${{ steps.version.outputs.version }}"
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token || secrets.CARGO_REGISTRY_TOKEN }}
      - name: Record published version
        run: |
          echo "### Published redisevents `v${{ steps.version.outputs.version }}`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          for c in redisevents redisevents-msgpack redisevents-projections redisevents-restate redisevents-axum redisevents-eventsourcing; do
            echo "- $c" >> "$GITHUB_STEP_SUMMARY"
          done
      - name: Tag release
        run: |
          tag="v${{ steps.version.outputs.version }}"
          if git ls-remote --exit-code --tags origin "$tag" >/dev/null 2>&1; then
            echo "Tag $tag already exists, skipping"
          else
            git tag "$tag"
            git push origin "$tag"
          fi
